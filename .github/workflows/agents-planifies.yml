name: Agents planifiés

# Déclenche l'analyse quotidienne des agents BOS-IA sur app.jamaliance.com.
# Prérequis : secret de dépôt BOS_CRON_SECRET (même valeur que dans hPanel).
# Optionnel : variable de dépôt BOS_APP_URL (défaut https://app.jamaliance.com).
# Sans secret, le workflow ne fait rien. Le serveur évite les doublons (verrou,
# intervalle minimal par agent) : l'activer dans les deux dépôts est sans risque.

on:
  schedule:
    # Du lundi au vendredi, 06:17 UTC (07:17 en hiver, 08:17 en été à Paris)
    - cron: "17 6 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  declencher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lancer les agents planifiés
        env:
          BOS_CRON_SECRET: ${{ secrets.BOS_CRON_SECRET }}
          BOS_APP_URL: ${{ vars.BOS_APP_URL || 'https://app.jamaliance.com' }}
        run: |
          if [ -z "$BOS_CRON_SECRET" ]; then
            echo "::notice::Secret BOS_CRON_SECRET absent : agents planifiés non déclenchés."
            exit 0
          fi
          status=$(curl -sS -o reponse.json -w "%{http_code}" -X POST \
            --max-time 60 --retry 2 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer $BOS_CRON_SECRET" \
            "$BOS_APP_URL/api/agents/planifie")
          cat reponse.json; echo
          if [ "$status" != "202" ] && [ "$status" != "200" ]; then
            echo "::error::Réponse HTTP $status de $BOS_APP_URL/api/agents/planifie"
            exit 1
          fi
