name: Surveillance

# Bilan de santé quotidien et sauvegarde hebdomadaire de app.jamaliance.com (adresse qui se met à jour automatiquement).
# Prérequis : secret de dépôt BOS_CRON_SECRET (même valeur que dans hPanel).
# Un bilan en erreur (base injoignable, SMTP refusé…) fait échouer ce workflow :
# GitHub prévient alors le propriétaire du dépôt par e-mail, même si le site ne
# peut plus rien envoyer lui-même. Sans secret : seule la sonde publique est
# vérifiée (le site répond, et c'est bien BOS-IA).

on:
  schedule:
    # Bilan de santé : tous les jours à 05:43 UTC
    - cron: "43 5 * * *"
    # Sauvegarde par e-mail : le dimanche à 02:37 UTC
    - cron: "37 2 * * 0"
  workflow_dispatch:
    inputs:
      tache:
        description: "sante, sauvegarde ou test_ia (vraie analyse IA, consomme un peu de crédit Anthropic)"
        default: sante
      url:
        description: "Adresse à vérifier (défaut : BOS_APP_URL)"
        required: false

permissions: {}

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOS_CRON_SECRET: ${{ secrets.BOS_CRON_SECRET }}
      BOS_APP_URL: ${{ inputs.url || vars.BOS_APP_URL || 'https://app.jamaliance.com' }}
      TACHE: ${{ github.event.schedule == '37 2 * * 0' && 'sauvegarde' || inputs.tache || 'sante' }}
    steps:
      - name: Hébergeur qui sert l'adresse (DNS et en-têtes)
        if: always()
        run: |
          host=$(echo "$BOS_APP_URL" | sed -E 's#^https?://##; s#/.*$##')
          echo "DNS $host :"; dig +short "$host" A; dig +short "$host" CNAME
          curl -sS -o /dev/null -D - --max-time 30 "$BOS_APP_URL/api/health" | grep -iE '^(HTTP|server|x-vercel|platform|x-powered|x-litespeed)' || true

      - name: Le site répond (sonde publique)
        run: |
          status=$(curl -sS -o publique.json -w "%{http_code}" --max-time 30 \
            --retry 2 --retry-delay 15 --retry-all-errors "$BOS_APP_URL/api/health" || true)
          cat publique.json 2>/dev/null; echo
          if [ "$status" != "200" ]; then
            echo "::error::$BOS_APP_URL/api/health répond HTTP $status (site arrêté, mal déployé ou domaine mal pointé)"
            exit 1
          fi
          if ! grep -q '"service":"bos-ia"' publique.json; then
            echo "::error::$BOS_APP_URL répond, mais ce n'est pas BOS-IA (page Hostinger par défaut ou mauvais site sur le sous-domaine ?)"
            exit 1
          fi
          echo "::notice::$BOS_APP_URL répond : BOS-IA en ligne."

      - name: Chargement des variables (noms seulement)
        if: always()
        run: curl -sS --max-time 30 "$BOS_APP_URL/api/health?diagnostic=1" || true

      - name: Bilan complet ou sauvegarde
        run: |
          if [ -z "$BOS_CRON_SECRET" ]; then
            echo "::warning::Secret BOS_CRON_SECRET absent (Settings → Secrets and variables → Actions → Repository secrets) : bilan complet et sauvegarde non effectués."
            exit 0
          fi
          if [ "$TACHE" = "test_ia" ]; then
            # Même parcours que le bouton « Lancer l'analyse IA » : lancement (202), puis suivi du résultat.
            auth="Authorization: Bearer $BOS_CRON_SECRET"
            status=$(curl -sS -o depart.json -w "%{http_code}" --max-time 30 -X POST -H "$auth" \
              -H "Content-Type: application/json" -d '{"agentId":"agt-001"}' "$BOS_APP_URL/api/agents/run" || echo "000")
            echo "Lancement : HTTP $status $(cat depart.json 2>/dev/null)"
            [ "$status" = "401" ] && { echo "::error::Secret refusé : BOS_CRON_SECRET n'a pas la même valeur dans GitHub et sur le serveur"; exit 1; }
            [ "$status" = "202" ] || { echo "::error::Le lancement de l'analyse a échoué (HTTP $status) : le bouton du cockpit échouerait de la même façon"; exit 1; }
            id=$(jq -r .jobId depart.json)
            for i in $(seq 1 60); do
              sleep 3
              curl -sS -o suivi.json --max-time 30 -H "$auth" "$BOS_APP_URL/api/agents/run?id=$id" || continue
              etat=$(jq -r '.statut // "inconnu"' suivi.json)
              [ "$etat" = "en_cours" ] && continue
              jq '{statut, error, modele: .run.model, actions: (.run.actions | length?), resume: .run.resume}' suivi.json
              if [ "$etat" = "succes" ]; then
                echo "::notice::Analyse IA réelle réussie en $((i*3)) s : $(jq -r '"\(.run.model), \(.run.actions | length) action(s)"' suivi.json)"
                exit 0
              fi
              echo "::error::Analyse IA : $(jq -r '.error // "état inattendu"' suivi.json)"
              exit 1
            done
            echo "::error::Analyse IA toujours en cours après 3 minutes"
            exit 1
          fi
          if [ "$TACHE" = "sauvegarde" ]; then
            status=$(curl -sS -o reponse.json -w "%{http_code}" -X POST --max-time 120 \
              -H "Authorization: Bearer $BOS_CRON_SECRET" "$BOS_APP_URL/api/sauvegarde")
          else
            status=$(curl -sS -o reponse.json -w "%{http_code}" --max-time 60 \
              --retry 2 --retry-delay 15 --retry-all-errors \
              -H "Authorization: Bearer $BOS_CRON_SECRET" "$BOS_APP_URL/api/health?complet=1")
          fi
          cat reponse.json; echo
          if [ "$status" = "401" ]; then
            echo "::error::Secret refusé : BOS_CRON_SECRET n'a pas la même valeur dans GitHub et dans hPanel"
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::$TACHE : réponse HTTP $status de $BOS_APP_URL"
            exit 1
          fi
